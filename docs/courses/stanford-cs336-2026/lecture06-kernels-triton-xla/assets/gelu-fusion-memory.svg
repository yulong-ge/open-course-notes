<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#475569"/>
    </marker>
    <style>
      .h { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .t { font: 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155; }
      .s { font: 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .box { rx:16; stroke-width:3; }
      .arr { stroke:#475569; stroke-width:4; fill:none; marker-end:url(#a); }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text class="h" x="300" y="48" text-anchor="middle">朴素 PyTorch：多个 kernel</text>
  <text class="h" x="900" y="48" text-anchor="middle">融合实现：一个 kernel</text>

  <rect class="box" x="75" y="90" width="450" height="90" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="300" y="145" text-anchor="middle">HBM</text>
  <rect class="box" x="150" y="245" width="300" height="70" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t" x="300" y="289" text-anchor="middle">kernel 1：x³ 与缩放</text>
  <rect class="box" x="150" y="370" width="300" height="70" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t" x="300" y="414" text-anchor="middle">kernel 2：exp / tanh</text>
  <rect class="box" x="150" y="495" width="300" height="70" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t" x="300" y="539" text-anchor="middle">kernel 3：乘法与输出</text>
  <path class="arr" d="M240 180 L240 235"/>
  <path class="arr" d="M360 315 L360 360"/>
  <path class="arr" d="M240 440 L240 485"/>
  <path class="arr" d="M445 280 C540 280,540 135,525 135"/>
  <path class="arr" d="M445 405 C575 405,575 145,525 145"/>
  <text class="s" x="72" y="605">中间张量多次写回、再读入 HBM，并伴随多次 launch</text>

  <rect class="box" x="675" y="90" width="450" height="90" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="900" y="145" text-anchor="middle">HBM</text>
  <rect class="box" x="720" y="270" width="360" height="190" fill="#dcfce7" stroke="#16a34a"/>
  <text class="h" x="900" y="322" text-anchor="middle">fused GeLU kernel</text>
  <text class="t" x="900" y="365" text-anchor="middle">load x → 全部逐元素计算</text>
  <text class="t" x="900" y="402" text-anchor="middle">→ store 最终 y</text>
  <path class="arr" d="M820 180 L820 258"/>
  <path class="arr" d="M980 270 L980 192"/>
  <text class="s" x="707" y="520">输入读一次、结果写一次；中间值尽量留在片上</text>
  <text class="s" x="767" y="553">数学函数不变，减少的是数据搬运与 launch</text>
</svg>
