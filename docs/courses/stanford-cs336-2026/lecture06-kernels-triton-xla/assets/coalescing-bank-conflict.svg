<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>
      .h { font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .t { font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155; }
      .s { font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .cell { stroke:#64748b; stroke-width:2; }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text class="h" x="300" y="52" text-anchor="middle">HBM：memory coalescing</text>
  <text class="h" x="900" y="52" text-anchor="middle">Shared memory：bank conflict</text>

  <text class="t" x="70" y="105">同一 warp 连续访问</text>
  <rect x="70" y="130" width="448" height="56" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <g fill="#93c5fd">
    <rect class="cell" x="78" y="138" width="48" height="40"/><rect class="cell" x="126" y="138" width="48" height="40"/>
    <rect class="cell" x="174" y="138" width="48" height="40"/><rect class="cell" x="222" y="138" width="48" height="40"/>
    <rect class="cell" x="270" y="138" width="48" height="40"/><rect class="cell" x="318" y="138" width="48" height="40"/>
    <rect class="cell" x="366" y="138" width="48" height="40"/><rect class="cell" x="414" y="138" width="48" height="40"/>
  </g>
  <text class="s" x="294" y="217" text-anchor="middle">相邻地址可合并成少量充分利用的 memory transaction</text>

  <text class="t" x="70" y="287">跨步访问</text>
  <g fill="#fed7aa">
    <rect class="cell" x="78" y="315" width="48" height="40"/>
    <rect class="cell" x="190" y="315" width="48" height="40"/>
    <rect class="cell" x="302" y="315" width="48" height="40"/>
    <rect class="cell" x="414" y="315" width="48" height="40"/>
  </g>
  <path d="M126 335 L190 335 M238 335 L302 335 M350 335 L414 335" stroke="#ea580c" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="s" x="294" y="397" text-anchor="middle">相同有效数据可能触发更多 transaction，浪费 HBM 带宽</text>

  <text class="t" x="665" y="105">32 个 bank（图中压缩展示 8 个）</text>
  <g>
    <rect class="cell" x="665" y="135" width="58" height="70" fill="#dcfce7"/>
    <rect class="cell" x="723" y="135" width="58" height="70" fill="#bbf7d0"/>
    <rect class="cell" x="781" y="135" width="58" height="70" fill="#dcfce7"/>
    <rect class="cell" x="839" y="135" width="58" height="70" fill="#bbf7d0"/>
    <rect class="cell" x="897" y="135" width="58" height="70" fill="#dcfce7"/>
    <rect class="cell" x="955" y="135" width="58" height="70" fill="#bbf7d0"/>
    <rect class="cell" x="1013" y="135" width="58" height="70" fill="#dcfce7"/>
    <rect class="cell" x="1071" y="135" width="58" height="70" fill="#bbf7d0"/>
  </g>
  <g class="s" text-anchor="middle">
    <text x="694" y="177">B0</text><text x="752" y="177">B1</text><text x="810" y="177">B2</text><text x="868" y="177">B3</text>
    <text x="926" y="177">B4</text><text x="984" y="177">B5</text><text x="1042" y="177">B6</text><text x="1100" y="177">B7</text>
  </g>

  <text class="t" x="665" y="275">无冲突：thread 分散到不同 bank</text>
  <g fill="#93c5fd" stroke="#2563eb" stroke-width="2">
    <circle cx="694" cy="320" r="20"/><circle cx="752" cy="320" r="20"/><circle cx="810" cy="320" r="20"/><circle cx="868" cy="320" r="20"/>
  </g>
  <text class="s" x="694" y="327" text-anchor="middle">t0</text><text class="s" x="752" y="327" text-anchor="middle">t1</text>
  <text class="s" x="810" y="327" text-anchor="middle">t2</text><text class="s" x="868" y="327" text-anchor="middle">t3</text>

  <text class="t" x="665" y="410">冲突：多个 thread 命中同一 bank 的不同地址</text>
  <g fill="#fecaca" stroke="#dc2626" stroke-width="2">
    <circle cx="694" cy="458" r="20"/><circle cx="694" cy="505" r="20"/><circle cx="694" cy="552" r="20"/><circle cx="694" cy="599" r="20"/>
  </g>
  <text class="s" x="694" y="465" text-anchor="middle">t0</text><text class="s" x="694" y="512" text-anchor="middle">t1</text>
  <text class="s" x="694" y="559" text-anchor="middle">t2</text><text class="s" x="694" y="606" text-anchor="middle">t3</text>
  <text class="s" x="817" y="535">访问会被串行化</text>
  <text class="s" x="817" y="570">swizzling 可重排地址、打散 bank 映射</text>

  <line x1="600" y1="80" x2="600" y2="640" stroke="#cbd5e1" stroke-width="3"/>
  <text class="s" x="600" y="662" text-anchor="middle">两者发生在不同存储层，不能混为一谈</text>
</svg>
